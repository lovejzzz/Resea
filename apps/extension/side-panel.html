<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resea capture</title>
    <link rel="stylesheet" href="side-panel.css" />
  </head>
  <body>
    <main>
      <div class="mark">R</div>
      <p class="eyebrow">RESEA RESEARCH CAPTURE</p>
      <h1>Capture the active source</h1>
      <p>Extract visible main content as inert text. Resea never captures cookies, form values, history, or executable code.</p>
      <button id="capture">Capture this page</button>
      <p id="status" role="status"></p>
      <pre id="preview" hidden></pre>
      <button id="download" class="secondary" hidden>Download capture JSON</button>
    </main>
    <script src="side-panel.js"></script>
  </body>
</html>
